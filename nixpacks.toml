[variables]
NIXPACKS_PHP_ROOT_DIR = ""

[phases.install]
cmds = [
    "mkdir -p app/Models",
    "composer install --optimize-autoloader --no-scripts --no-interaction"
]

[phases.build]
cmds = [
    "composer dump-autoload --optimize",
    "mkdir -p public/tailwind/src",
    "cp tailwind/src/output.css public/tailwind/src/output.css",
    "ln -s /app/views /app/public/views"
]
